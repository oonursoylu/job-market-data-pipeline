version: 2

models:
  - name: mart_latest_postings
    description: "Latest observed job postings for dashboard display. This mart contains one row per source job id with the latest observed search context and analytical posting group fields for deduplication-aware reporting."
    columns:
      - name: latest_posting_id
        description: "Deterministic identifier for the latest posting mart grain."
        tests:
          - not_null
          - unique

      - name: source
        description: "Source system for the job posting."
        tests:
          - not_null

      - name: job_id
        description: "Job identifier from the source system. This remains the raw source grain."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_job_postings')
                field: job_id

      - name: posting_group_id
        description: "Analytical group identifier for postings that likely represent the same real-world job opportunity across multiple source job IDs or locations."
        tests:
          - not_null

      - name: job_title
        description: "Job title from the posting."
        tests:
          - not_null

      - name: company_name
        description: "Company name from the posting, displayed as Unknown when the source value is missing."
        tests:
          - not_null

      - name: company_name_was_missing
        description: "True when the source did not provide a usable company name."
        tests:
          - not_null

      - name: location
        description: "Display location from the posting."

      - name: country
        description: "Country field from the source posting."

      - name: search_country
        description: "Country code from the latest observed search context."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - de
                  - gb

      - name: search_role
        description: "Role keyword group from the latest observed search context."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - data_engineer
                  - analytics_engineer
                  - ai_engineer

      - name: normalized_company_name
        description: "Lowercased and cleaned company name used for analytical grouping."

      - name: normalized_job_title
        description: "Lowercased and cleaned job title used for analytical grouping."

      - name: posted_date
        description: "Date when the job posting was created at the source, when available."

      - name: posting_age_days
        description: "Non-negative age of the source posting at its latest observation date."

      - name: is_stale_at_latest_observation
        description: "True when the source posting date was more than 90 days before its latest observation."
        tests:
          - not_null

      - name: is_training_or_placement
        description: "Conservative title-based flag for trainee, apprenticeship, internship, placement programme, career-switch or no-experience adverts."
        tests:
          - not_null

      - name: description_length
        description: "Number of characters in the source description snippet."

      - name: description_is_source_snippet
        description: "True when the source does not guarantee full advert text."
        tests:
          - not_null

      - name: description_is_likely_truncated
        description: "True when the source description reaches the observed 500-character snippet boundary."
        tests:
          - not_null

      - name: salary_min
        description: "Cleaned positive minimum salary, when available."

      - name: salary_max
        description: "Cleaned positive maximum salary, when available."

      - name: salary_is_available
        description: "True when at least one positive salary bound is available."
        tests:
          - not_null

      - name: salary_range_is_complete
        description: "True when both positive salary bounds are available."
        tests:
          - not_null

      - name: currency
        description: "ISO currency code for usable salary data; inferred as EUR for Germany or GBP for the UK when absent at source."

      - name: salary_currency_was_inferred
        description: "True when the salary currency was inferred from the search country."
        tests:
          - not_null

      - name: salary_is_predicted
        description: "Source indicator showing whether Adzuna predicted the salary, when supplied."

      - name: contract_type
        description: "Contract type supplied by the source, when available."

      - name: first_observed_date
        description: "First extraction date when this job posting was observed."
        tests:
          - not_null

      - name: latest_extract_date
        description: "Most recent extraction date when this job posting was observed."
        tests:
          - not_null

      - name: times_observed
        description: "Number of extraction dates where this job posting was observed."
        tests:
          - not_null

      - name: redirect_url
        description: "Source redirect URL for the job posting."
